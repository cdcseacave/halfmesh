[build-system]
# >=0.11 for PEP 639 license metadata (SPDX string + license-files below)
requires = ["scikit-build-core>=0.11", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "halfmesh"
dynamic = ["version"]
description = "Fast, compact half-edge triangle mesh processing library"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "cDc", email = "cdc.seacave@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/cdcseacave/halfmesh"

[project.optional-dependencies]
test = ["pytest"]

[tool.scikit-build]
minimum-version = "0.11"
cmake.version = ">=3.21"
cmake.args = ["-DHALFMESH_BUILD_PYTHON=ON"]
wheel.packages = ["python/halfmesh"]
install.components = ["python"]
# Persistent build tree (default is a throwaway temp dir): repeat
# `pip install .` runs become true incremental C++ rebuilds instead of a full
# reconfigure + recompile. Lives under build/ (git-ignored).
build-dir = "build/{wheel_tag}"

# Version is single-sourced from project(halfmesh VERSION x.y.z) in CMakeLists.
[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'project\(halfmesh VERSION (?P<value>[0-9]+\.[0-9]+\.[0-9]+)'

[tool.cibuildwheel]
build = ["cp310-manylinux_x86_64", "cp311-manylinux_x86_64", "cp312-manylinux_x86_64", "cp313-manylinux_x86_64"]
manylinux-x86_64-image = "manylinux_2_28"
test-requires = ["pytest"]
test-command = "pytest {project}/python/tests -q"

[tool.cibuildwheel.linux]
# cibuildwheel's default repair command (`auditwheel repair -w {dest_dir}
# {wheel}`) auto-upgrades the tag to whatever *more* compatible (lower
# glibc floor) manylinux policy the wheel happens to also satisfy, e.g.
# producing "...manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl" instead of
# the single "...manylinux_2_28_x86_64.whl" this project's release process
# (see wheels.yml + the radiance-integration plan, which pins the exact
# filename) expects. --only-plat pins the tag to exactly the requested
# --plat, matching the fixed manylinux-x86_64-image below.
repair-wheel-command = "auditwheel repair --plat manylinux_2_28_x86_64 --only-plat -w {dest_dir} {wheel}"
# vcpkg bootstraps inside the manylinux container; deps build static+PIC via
# the x64-linux-pic overlay triplet (auto-selected by CMakeLists.txt).
# The vcpkg tool itself is fetched by the exact pinned commit (not "--depth 1"
# off the branch tip): a baseline commit is not reachable from a shallow clone
# of current master, so vcpkg fails to `git show` versions/baseline.json at
# that SHA and every dependency resolution dies.
#
# The commit is read out of vcpkg.json rather than written here, because the
# copy that used to live here silently went stale the moment the baseline
# advanced -- 0.3.0 shipped a tag whose wheels could not build for exactly
# that reason. vcpkg.json is the single source; CI's VCPKG_COMMIT is the one
# remaining copy, and it fails loudly (every job resolves against it) rather
# than only on a release tag.
#
# pybind11 is NOT built by vcpkg — it comes from pip via [build-system]
# requires (its vcpkg port would drag in vcpkg's own from-source CPython:
# openssl, libffi, an autotools chain, ~20 extra ports). The vcpkg manifest
# builds only the C++ deps: eigen3, opencv4 (reduced), tinyply, tinygltf,
# bshoshany-thread-pool — all CMake-based; nasm is for libjpeg-turbo.
#
# halfmesh itself needs g++ >= 13 for <format> (see the same note in
# ci.yml's python-bindings job) — the manylinux_2_28 image's default
# compiler on PATH is gcc-toolset-12 (g++ 12, no <format>), so
# gcc-toolset-13 is installed and selected explicitly via CC/CXX below.
before-all = '''
dnf install -y curl zip unzip tar git nasm gcc-toolset-13 &&
VCPKG_BASELINE=$(sed -n 's/.*"builtin-baseline"[[:space:]]*:[[:space:]]*"\([0-9a-f]*\)".*/\1/p' {project}/vcpkg.json) &&
test -n "$VCPKG_BASELINE" || (echo "could not read builtin-baseline from vcpkg.json" && exit 1) &&
echo "vcpkg baseline: $VCPKG_BASELINE" &&
mkdir -p /opt/vcpkg && cd /opt/vcpkg && git init -q &&
git remote add origin https://github.com/microsoft/vcpkg &&
git fetch --depth 1 origin "$VCPKG_BASELINE" &&
git checkout -q FETCH_HEAD &&
/opt/vcpkg/bootstrap-vcpkg.sh -disableMetrics
'''
environment = { VCPKG_ROOT = "/opt/vcpkg", CC = "/opt/rh/gcc-toolset-13/root/usr/bin/gcc", CXX = "/opt/rh/gcc-toolset-13/root/usr/bin/g++" }
