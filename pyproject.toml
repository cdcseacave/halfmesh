[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "halfmesh"
dynamic = ["version"]
description = "Fast, compact half-edge triangle mesh processing library"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "cDc", email = "cdc.seacave@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/cdcseacave/halfmesh"

[project.optional-dependencies]
test = ["pytest"]

[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.21"
cmake.args = ["-DHALFMESH_BUILD_PYTHON=ON"]
wheel.packages = ["python/halfmesh"]
install.components = ["python"]

# Version is single-sourced from project(halfmesh VERSION x.y.z) in CMakeLists.
[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'project\(halfmesh VERSION (?P<value>[0-9]+\.[0-9]+\.[0-9]+)'

[tool.cibuildwheel]
build = ["cp310-manylinux_x86_64", "cp311-manylinux_x86_64", "cp312-manylinux_x86_64", "cp313-manylinux_x86_64"]
manylinux-x86_64-image = "manylinux_2_28"
test-requires = ["pytest"]
test-command = "pytest {project}/python/tests -q"

[tool.cibuildwheel.linux]
# vcpkg bootstraps inside the manylinux container; deps build static+PIC via
# the x64-linux-pic overlay triplet (auto-selected by CMakeLists.txt).
# The vcpkg tool itself is fetched by the exact pinned commit (not "--depth 1"
# off the branch tip): vcpkg.json's "builtin-baseline" pins
# 9e593bb18ea69cc5095e012465dcd675a822ed0d (same pin as CI's VCPKG_COMMIT),
# and that commit is not reachable from a shallow clone of current master, so
# vcpkg fails to `git show` versions/baseline.json at that SHA.
#
# pybind11's vcpkg port depends on vcpkg's own python3 port (a from-source,
# statically-linked CPython, distinct from the manylinux image's /opt/python
# interpreters) — which pulls in openssl, sqlite3, bzip2, expat,
# gettext-libintl, libb2, libffi, libiconv, liblzma, libuuid (host+pic each).
# openssl's build needs the Perl Time::Piece module (perl-Time-Piece), absent
# from the manylinux_2_28 image ("Can't locate Time/Piece.pm"). Several of
# the autotools-based ports in that list (confirmed: libb2) need libtool
# (libtoolize) and autoconf-archive; autoconf/automake themselves are already
# present. But the manylinux image's own /usr/local/bin/aclocal (a newer
# automake built into the image, shadowing the dnf-installed one on PATH)
# only searches /usr/local/share/aclocal, while dnf's autoconf-archive
# package installs its macros under /usr/share/aclocal — so ACLOCAL_PATH
# must point there or aclocal reports autoconf-archive "missing" regardless.
#
# Once the deps build, halfmesh itself needs g++ >= 13 for <format> (see the
# same note in ci.yml's python-bindings job) — the manylinux_2_28 image's
# default compiler on PATH is gcc-toolset-12 (g++ 12, no <format>), so
# gcc-toolset-13 is installed and selected explicitly via CC/CXX below.
before-all = """
dnf install -y curl zip unzip tar git perl-IPC-Cmd perl-Time-Piece nasm libtool autoconf-archive gcc-toolset-13 &&
mkdir -p /opt/vcpkg && cd /opt/vcpkg && git init -q &&
git remote add origin https://github.com/microsoft/vcpkg &&
git fetch --depth 1 origin 9e593bb18ea69cc5095e012465dcd675a822ed0d &&
git checkout -q FETCH_HEAD &&
/opt/vcpkg/bootstrap-vcpkg.sh -disableMetrics
"""
environment = { VCPKG_ROOT = "/opt/vcpkg", ACLOCAL_PATH = "/usr/share/aclocal", CC = "/opt/rh/gcc-toolset-13/root/usr/bin/gcc", CXX = "/opt/rh/gcc-toolset-13/root/usr/bin/g++" }
